name: .github/workflows/bot.yml

on:
  schedule:
    - cron: "*/15 7-16 * * 1-5"
    - cron: "50 15 * * 1-5"
    - cron: "50 16 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto oppure test"
        default: "auto"

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bot.py ${{ github.event.inputs.mode || 'auto' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add signals.json
          git diff --staged --quiet || (git commit -m "update signals" && git push)
